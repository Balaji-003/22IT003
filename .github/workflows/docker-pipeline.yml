name: docker-pipeline-balaji
on: push
jobs:
  docker-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print your Register number
        run: echo "Hello World - 22IT003"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t balajiv003/ml-model-22it003 .

      - name: Docker Image
        run: docker images

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Push
        run: docker push balajiv003/ml-model-22it003
        
